{% extends 'base.html' %}
{% load static %}

{% block title %}Изтрий статия{% endblock %}

{% block content %}
<div class="form-container text-center">
    <h2 class="text-danger">Изтрий статията</h2>
    <p class="lead-text">Сигурни ли сте, че искате да изтриете статията:</p>
    <p><strong>{{ article.title }}</strong> от <strong>{{ article.author.user.username }}</strong>?</p>
    <p class="text-muted">Това действие е необратимо.</p>
    <form method="post">
        {% csrf_token %}
        <div class="detail-actions">
            <button type="submit" class="owner-action owner-action-delete" title="Да, изтрий" aria-label="Да, изтрий"><i class="fas fa-trash-alt"></i></button>
            <a href="{% url 'article-detail' pk=article.pk %}" class="owner-action owner-action-cancel" title="Откажи" aria-label="Откажи"><i class="fas fa-times"></i></a>
        </div>
    </form>
</div>
{% endblock %}
